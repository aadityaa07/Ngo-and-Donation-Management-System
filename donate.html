<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate | CareConnect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a class="logo" href="index.html">CareConnect</a>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="causes.html">Causes</a></li>
          <li><a href="donate.html">Donate</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="admin.html">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="form-section">
    <div class="container">
      <div class="form-card">
        <h1>Make a Donation</h1>
        <p class="form-note">
          This is a frontend demonstration. The form does not process real payments.
        </p>

        <form action="#" method="post">
          <div class="form-group">
            <label for="donor-name">Full Name</label>
            <input type="text" id="donor-name" name="full_name" required>
          </div>

          <div class="form-group">
            <label for="donor-email">Email</label>
            <input type="email" id="donor-email" name="email" required>
          </div>

          <div class="form-group">
            <label for="amount">Donation Amount (INR)</label>
            <input type="number" id="amount" name="amount" min="1" step="1" required>
          </div>

          <div class="form-group">
            <label for="cause">Select Cause</label>
            <select id="cause" name="cause" required>
              <option value="">Choose a cause</option>
              <option value="education">Education</option>
              <option value="healthcare">Healthcare</option>
              <option value="food-shelter">Food and Shelter</option>
            </select>
          </div>

          <div class="form-group">
            <label for="payment">Payment Method</label>
            <select id="payment" name="payment_method" required>
              <option value="">Choose a payment method</option>
              <option value="upi">UPI</option>
              <option value="card">Card</option>
              <option value="net-banking">Net Banking</option>
            </select>
          </div>

          <button class="btn btn-primary" type="submit">Donate Now</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <div>
        <h3>CareConnect</h3>
        <p>NGO and Donation Management System</p>
      </div>
      <div>
        <h3>Quick Links</h3>
        <ul class="footer-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="causes.html">Causes</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
    <div class="container">
      <p>&copy; 2026 CareConnect. Frontend prototype.</p>
    </div>
  </footer>
</body>
</html>
